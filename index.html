  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
  header{padding:26px 16px 10px;text-align:center}
  h1{margin:0;font-size:1.8rem}
  header p{color:var(--muted);margin:6px 0 0;font-size:1.05rem}
  .wrap{max-width:1200px;margin:auto;padding:0 16px}
  .search{display:block;width:100%;max-width:420px;margin:8px auto;background:var(--card);border:1px solid var(--line);color:var(--text);padding:13px 16px;border-radius:12px;font-size:1.1rem}
  .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 0}
  .btn{background:var(--btn);color:var(--text);border:1px solid var(--line);padding:12px 20px;border-radius:12px;font-size:1.05rem;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;transition:.2s}
  .btn:hover,.btn.active{background:#fff;color:#000;border-color:#fff}
  .btn.off{opacity:.4;pointer-events:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;padding:12px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card img{width:100%;height:180px;object-fit:cover;background:#151515}
  .cover{width:100%;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;text-align:center;padding:8px}
  .cover b{font-size:2.4rem;letter-spacing:2px}
  .cover small{font-size:.85rem;opacity:.8;letter-spacing:1px}
  .info{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .info h3{margin:0;font-size:1.2rem}
  .tag{font-size:.9rem;color:var(--muted)}
  .info .btn{margin-top:auto}
  .notice{margin:18px 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:1rem}
  .empty{text-align:center;color:var(--muted);padding:30px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:24px 16px}

const grid=document.getElementById('grid');
const filtersEl=document.getElementById('filters');
const searchEl=document.getElementById('search');
let current='SEMUA';

const consoles=['SEMUA',...new Set(GAMES.map(g=>g.console))];
consoles.forEach(c=>{
  const b=document.createElement('button');
  b.className='btn'+(c===current?' active':'');
  b.textContent=c;
  b.onclick=()=>{current=c;[...filtersEl.children].forEach(x=>x.classList.toggle('active',x===b));render();};
  filtersEl.appendChild(b);
});

const COLORS={'PSP':['#1a1a1a','#3b3b3b'],'PS1':['#0b1f3a','#1d4f91'],'PS2':['#1b1033','#4a2a8a'],'PS Vita':['#06262b','#127a8a'],'REQUEST':['#2b0a0a','#8a1d1d'],'EMULATOR':['#102010','#2f7a2f']};
function initials(t){return t.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';}
function makeCover(g){
  const fallback=()=>{
    const c=document.createElement('div');c.className='cover';
    const col=COLORS[g.console]||['#111','#333'];
    c.style.background='linear-gradient(135deg,'+col[0]+','+col[1]+')';
    const b=document.createElement('b');b.textContent=initials(g.title);
    const sm=document.createElement('small');sm.textContent=g.console;
    c.append(b,sm);return c;
  };
  if(!g.image)return fallback();
  const im=document.createElement('img');im.src=g.image;im.alt=g.title;im.loading='lazy';
  im.onerror=()=>im.replaceWith(fallback());
  return im;
}

function render(){
  const q=searchEl.value.toLowerCase().trim();
  grid.innerHTML='';
  const list=GAMES.filter(g=>(current==='SEMUA'||g.console===current)&&g.title.toLowerCase().includes(q));
  if(!list.length){grid.innerHTML='<div class="empty">Game tidak ditemukan.</div>';return;}
  list.forEach(g=>{
    const card=document.createElement('div');card.className='card';
    card.appendChild(makeCover(g));
    const info=document.createElement('div');info.className='info';
    const h=document.createElement('h3');h.textContent=g.title;
    const t=document.createElement('span');t.className='tag';t.textContent=g.console+(g.size?' • '+g.size:'');
    const a=document.createElement('a');a.className='btn';
    if(g.link){a.href=g.link;a.target='_blank';a.rel='noopener';a.textContent=g.console==='REQUEST'?'📩 Request':'⬇ Download';}
    else{a.classList.add('off');a.textContent='Segera';}
    info.append(h,t,a);card.appendChild(info);grid.appendChild(card);
  });
}
searchEl.addEventListener('input',render);
render();
